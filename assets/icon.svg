<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- AeroTask: a glass bar with four items; the active (cyan) one opens a
       glass menu below it. Aero-style glass: sky-blue to cyan body, soft gloss
       on the upper half, bright rim and a gentle inner glow. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5CC8FF"/>
      <stop offset="0.55" stop-color="#1E8FE0"/>
      <stop offset="1" stop-color="#0B5FB8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#3FF3FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3FF3FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9FF6FF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="menu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="item" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#D6EEFF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9FFFF"/>
      <stop offset="0.5" stop-color="#3FE6FF"/>
      <stop offset="1" stop-color="#00B4E6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#body)"/>
  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#glow)"/>
    <!-- Aero gloss: curved highlight over the upper half -->
    <path d="M16 16 H496 V214 C380 250 132 250 16 214 Z" fill="url(#gloss)"/>
  </g>
  <rect x="19" y="19" width="474" height="474" rx="109" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- glass menu dropping from the active item (drawn first, under the bar) -->
  <rect x="176" y="214" width="236" height="210" rx="30" fill="#00375F" opacity="0.30" filter="url(#shadow)"/>
  <rect x="176" y="206" width="236" height="210" rx="30" fill="url(#menu)"/>
  <rect x="177.5" y="207.5" width="233" height="207" rx="28.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3"/>
  <rect x="192" y="232" width="204" height="40" rx="14" fill="#3FE6FF" opacity="0.55"/>
  <rect x="210" y="246" width="120" height="12" rx="6" fill="#FFFFFF"/>
  <rect x="210" y="302" width="150" height="12" rx="6" fill="#FFFFFF" opacity="0.88"/>
  <rect x="210" y="344" width="104" height="12" rx="6" fill="#FFFFFF" opacity="0.88"/>
  <rect x="210" y="386" width="132" height="12" rx="6" fill="#FFFFFF" opacity="0.7"/>

  <!-- glass bar -->
  <rect x="62" y="104" width="388" height="96" rx="34" fill="#00375F" opacity="0.28" filter="url(#shadow)"/>
  <rect x="62" y="96" width="388" height="96" rx="34" fill="url(#bar)"/>
  <rect x="63.5" y="97.5" width="385" height="93" rx="32.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3"/>

  <!-- items: the second one is active (cyan glow + indicator) -->
  <rect x="96" y="120" width="48" height="48" rx="14" fill="url(#item)"/>
  <circle cx="220" cy="144" r="44" fill="#3FF3FF" opacity="0.65" filter="url(#soft)"/>
  <rect x="196" y="120" width="48" height="48" rx="14" fill="url(#active)"/>
  <rect x="199" y="123" width="42" height="18" rx="9" fill="#FFFFFF" opacity="0.55"/>
  <rect x="268" y="120" width="48" height="48" rx="14" fill="url(#item)"/>
  <rect x="340" y="120" width="48" height="48" rx="14" fill="url(#item)" opacity="0.9"/>
  <rect x="204" y="178" width="32" height="6" rx="3" fill="#B9FFFF"/>
</svg>
